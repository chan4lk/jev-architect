[package]
name = "bistec-architect"
version = "0.1.0"
description = "BISTEC Architect desktop app"
authors = ["BISTEC Global"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "bistec-architect"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "bistec_architect"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "catalog-check"
path = "src/bin/catalog_check.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
thiserror = "2"
serde_yaml = "0.9"
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
pdf-extract = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
minijinja = "2"
sha2 = "0.10"
hex = "0.4"
regex = "1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
